<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KLIA T1 Live Flight Board</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {

            --background: #07111f;
            --panel: #111d2e;
            --panel-light: #17263b;
            --border: #27384e;

            --text: #f8fafc;
            --muted: #8ea1b8;

            --blue: #38bdf8;
            --blue-dark: #0284c7;

            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
        }


        html {
            color-scheme: dark;
        }


        body {

            margin: 0;

            min-height: 100vh;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top,
                    #12243b,
                    var(--background) 45%
                );

            color: var(--text);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        .container {

            width: 100%;

            max-width: 1400px;

            margin: auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            flex-wrap: wrap;

            padding-bottom: 20px;

            margin-bottom: 16px;

            border-bottom:
                1px solid var(--border);
        }


        .brand {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        h1 {

            margin: 0;

            font-size: clamp(
                20px,
                3vw,
                30px
            );

            color: var(--blue);
        }


        .subtitle {

            margin: 0;

            color: var(--muted);

            font-size: 14px;
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .controls {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        button {

            border:
                1px solid var(--border);

            background:
                var(--panel);

            color: white;

            border-radius: 10px;

            padding:
                11px 18px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition:
                0.2s ease;
        }


        button:hover {

            background:
                var(--panel-light);

            transform:
                translateY(-1px);
        }


        button.active {

            background:
                var(--blue-dark);

            border-color:
                var(--blue);
        }


        button:disabled {

            opacity: 0.55;

            cursor: wait;
        }


        /* =====================================================
           STATUS BAR
        ====================================================== */

        .status-bar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 12px;

            color: var(--muted);

            font-size: 13px;
        }


        .connection {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .connection-dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background:
                var(--muted);
        }


        .connection-dot.online {

            background:
                var(--green);

            box-shadow:
                0 0 10px
                rgba(
                    34,
                    197,
                    94,
                    0.8
                );
        }


        .connection-dot.offline {

            background:
                var(--red);
        }


        /* =====================================================
           TABLE
        ====================================================== */

        .table-container {

            overflow-x: auto;

            border:
                1px solid var(--border);

            border-radius: 14px;

            background:
                rgba(
                    17,
                    29,
                    46,
                    0.96
                );

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );
        }


        table {

            width: 100%;

            min-width: 850px;

            border-collapse:
                collapse;
        }


        thead {

            background:
                #0b1523;
        }


        th {

            padding:
                15px 18px;

            text-align: left;

            color: var(--muted);

            font-size: 12px;

            letter-spacing:
                0.05em;

            text-transform:
                uppercase;

            border-bottom:
                1px solid var(--border);
        }


        td {

            padding:
                15px 18px;

            border-bottom:
                1px solid var(--border);

            font-size: 14px;

            white-space:
                nowrap;
        }


        tbody tr {

            transition:
                0.15s ease;
        }


        tbody tr:hover {

            background:
                rgba(
                    56,
                    189,
                    248,
                    0.045
                );
        }


        tbody tr:last-child td {

            border-bottom:
                none;
        }


        .flight-number {

            color:
                var(--blue);

            font-weight:
                700;
        }


        /* =====================================================
           FLIGHT STATUS
        ====================================================== */

        .flight-status {

            display:
                inline-flex;

            align-items:
                center;

            padding:
                6px 10px;

            border-radius:
                8px;

            font-size:
                12px;

            font-weight:
                700;
        }


        .status-normal {

            color:
                #dbeafe;

            background:
                #334155;
        }


        .status-boarded {

            background:
                #064e3b;

            color:
                #a7f3d0;
        }


        .status-delayed {

            background:
                #7f1d1d;

            color:
                #fecaca;
        }


        .status-gate {

            background:
                #78350f;

            color:
                #fde68a;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .message {

            text-align:
                center;

            padding:
                35px !important;

            color:
                var(--muted);
        }


        .error {

            color:
                #fca5a5;
        }


        .spinner {

            display:
                inline-block;

            width:
                14px;

            height:
                14px;

            margin-right:
                8px;

            border:
                2px solid
                var(--border);

            border-top-color:
                var(--blue);

            border-radius:
                50%;

            vertical-align:
                -2px;

            animation:
                spin
                0.7s
                linear
                infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (
            max-width: 768px
        ) {

            body {
                padding: 12px;
            }


            header {

                align-items:
                    stretch;
            }


            .controls {

                width:
                    100%;
            }


            .controls button {

                flex:
                    1;
            }


            .status-bar {

                font-size:
                    12px;
            }
        }


        @media (
            max-width: 480px
        ) {

            body {
                padding: 8px;
            }


            .controls {

                display:
                    grid;

                grid-template-columns:
                    1fr 1fr;
            }


            #btn-refresh {

                grid-column:
                    1 / -1;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <header>

        <div class="brand">

            <h1>
                KLIA Terminal 1
                Live Flight Details
            </h1>

            <p class="subtitle">
                Real-Time Flight Information
            </p>

        </div>


        <div class="controls">

            <button
                id="btn-departures"
                class="active"
                onclick="
                    fetchFlights(
                        'departures'
                    )
                "
            >
                🛫 Departures
            </button>


            <button
                id="btn-arrivals"
                onclick="
                    fetchFlights(
                        'arrivals'
                    )
                "
            >
                🛬 Arrivals
            </button>


            <button
                id="btn-refresh"
                onclick="
                    fetchFlights(
                        currentType
                    )
                "
            >
                ↻ Refresh
            </button>

        </div>

    </header>


    <div class="status-bar">

        <div class="connection">

            <span
                id="connection-dot"
                class="connection-dot"
            ></span>

            <span
                id="connection-text"
            >
                Connecting...
            </span>

        </div>


        <div>

            Last updated:

            <span id="last-updated">
                --
            </span>

        </div>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Time
                    </th>

                    <th>
                        Flight No.
                    </th>

                    <th>
                        Airline
                    </th>

                    <th
                        id="location-header"
                    >
                        Destination
                    </th>

                    <th>
                        Gate
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>


            <tbody
                id="flight-data"
            >

                <tr>

                    <td
                        colspan="6"
                        class="message"
                    >

                        <span
                            class="spinner"
                        ></span>

                        Loading flight data...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<script>

    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     *
     * IMPORTANT:
     *
     * Do NOT use:
     *
     * http://127.0.0.1:5000/api/flights
     *
     * We use a relative API path instead.
     *
     * This means HTML and Flask use the same domain.
     */

    const API_BASE =
        "/api/flights";


    /*
     * Refresh every 60 seconds.
     */

    const AUTO_REFRESH =
        60000;


    let currentType =
        "departures";


    let controller =
        null;



    /*
     * =========================================================
     * HTML ESCAPING
     * =========================================================
     */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? "—"
        )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
    }



    /*
     * =========================================================
     * CONNECTION STATUS
     * =========================================================
     */

    function setConnection(
        online
    ) {

        const dot =
            document.getElementById(
                "connection-dot"
            );


        const text =
            document.getElementById(
                "connection-text"
            );


        dot.className =
            "connection-dot";


        if (online) {

            dot.classList.add(
                "online"
            );


            text.textContent =
                "Live data connected";

        } else {

            dot.classList.add(
                "offline"
            );


            text.textContent =
                "Flight service unavailable";
        }
    }



    /*
     * =========================================================
     * STATUS STYLE
     * =========================================================
     */

    function getStatusClass(
        status
    ) {

        const value =
            String(
                status || ""
            ).toLowerCase();


        if (
            value.includes(
                "delay"
            ) ||

            value.includes(
                "cancel"
            )
        ) {

            return "status-delayed";
        }


        if (
            value.includes(
                "board"
            ) ||

            value.includes(
                "land"
            ) ||

            value.includes(
                "arrived"
            ) ||

            value.includes(
                "departed"
            )
        ) {

            return "status-boarded";
        }


        if (
            value.includes(
                "gate"
            ) ||

            value.includes(
                "final call"
            )
        ) {

            return "status-gate";
        }


        return "status-normal";
    }



    /*
     * =========================================================
     * LOADING BUTTONS
     * =========================================================
     */

    function setButtons(
        loading
    ) {

        document.getElementById(
            "btn-departures"
        ).disabled =
            loading;


        document.getElementById(
            "btn-arrivals"
        ).disabled =
            loading;


        document.getElementById(
            "btn-refresh"
        ).disabled =
            loading;
    }



    /*
     * =========================================================
     * FETCH FLIGHTS
     * =========================================================
     */

    async function fetchFlights(
        type = "departures",
        silent = false
    ) {

        currentType =
            type;


        /*
         * Toggle active button.
         */

        document.getElementById(
            "btn-departures"
        ).classList.toggle(
            "active",
            type === "departures"
        );


        document.getElementById(
            "btn-arrivals"
        ).classList.toggle(
            "active",
            type === "arrivals"
        );


        /*
         * Change table heading.
         */

        document.getElementById(
            "location-header"
        ).textContent =

            type === "departures"

            ? "Destination"

            : "Origin";


        const tbody =
            document.getElementById(
                "flight-data"
            );


        if (!silent) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="message"
                    >

                        <span
                            class="spinner"
                        ></span>

                        Loading live
                        ${escapeHTML(type)}
                        flights...

                    </td>

                </tr>

            `;
        }


        /*
         * Cancel previous request.
         */

        if (controller) {

            controller.abort();
        }


        controller =
            new AbortController();


        const timeout =
            setTimeout(

                () =>
                    controller.abort(),

                15000
            );


        setButtons(
            true
        );


        try {


            /*
             * The URL will become:
             *
             * /api/flights/departures
             *
             * OR
             *
             * /api/flights/arrivals
             */

            const response =
                await fetch(

                    `${API_BASE}/${type}`,

                    {

                        method:
                            "GET",

                        headers: {

                            "Accept":
                                "application/json"
                        },

                        cache:
                            "no-store",

                        signal:
                            controller.signal
                    }
                );


            clearTimeout(
                timeout
            );


            if (
                !response.ok
            ) {

                throw new Error(

                    `Server error: ${response.status}`
                );
            }


            const result =
                await response.json();


            if (
                result.success === false
            ) {

                throw new Error(

                    result.message ||
                    "Flight API error"
                );
            }


            const flights =
                Array.isArray(
                    result.data
                )

                ? result.data

                : [];


            /*
             * No flights.
             */

            if (
                flights.length === 0
            ) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="message"
                        >

                            No flight information
                            currently available.

                        </td>

                    </tr>

                `;


                setConnection(
                    true
                );


                return;
            }


            /*
             * Build rows.
             */

            const rows =
                flights.map(

                    flight => {


                        const status =
                            flight.status ||
                            "Scheduled";


                        const location =

                            type ===
                            "departures"

                            ? (
                                flight.destination ||
                                "—"
                            )

                            : (
                                flight.origin ||
                                "—"
                            );


                        const statusClass =
                            getStatusClass(
                                status
                            );


                        return `

                            <tr>

                                <td>

                                    <strong>

                                        ${escapeHTML(
                                            flight.time
                                        )}

                                    </strong>

                                </td>


                                <td
                                    class="
                                        flight-number
                                    "
                                >

                                    ${escapeHTML(
                                        flight.flight_no
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        flight.airline
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        location
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        flight.gate
                                    )}

                                </td>


                                <td>

                                    <span
                                        class="
                                            flight-status
                                            ${statusClass}
                                        "
                                    >

                                        ${escapeHTML(
                                            status
                                        )}

                                    </span>

                                </td>

                            </tr>

                        `;
                    }
                );


            tbody.innerHTML =
                rows.join("");


            setConnection(
                true
            );


            /*
             * Updated time.
             */

            document.getElementById(
                "last-updated"
            ).textContent =

                new Date()
                .toLocaleTimeString(

                    "en-MY",

                    {

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );


        } catch (
            error
        ) {


            clearTimeout(
                timeout
            );


            /*
             * Ignore old aborted
             * request if user switched tabs.
             */

            if (
                error.name ===
                "AbortError"
            ) {

                return;
            }


            console.error(
                "Flight API error:",
                error
            );


            setConnection(
                false
            );


            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="6"

                        class="
                            message
                            error
                        "
                    >

                        Unable to retrieve
                        flight information.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;


        } finally {


            setButtons(
                false
            );
        }
    }



    /*
     * =========================================================
     * INITIALIZE PAGE
     * =========================================================
     */

    document.addEventListener(

        "DOMContentLoaded",

        () => {


            /*
             * First load.
             */

            fetchFlights(
                "departures"
            );


            /*
             * Auto refresh.
             */

            setInterval(

                () => {

                    fetchFlights(
                        currentType,
                        true
                    );

                },

                AUTO_REFRESH
            );

        }
    );

</script>


</body>

</html>
