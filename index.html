```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KLIA Terminal 1 Flight Tracker</title>

    <style>
        :root {
            --primary: #002f6c;
            --accent: #d4af37;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: var(--bg);
            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .tracker-card {
            background: var(--card-bg);
            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            width: 100%;
            max-width: 450px;

            text-align: center;
        }

        .logo-placeholder {
            color: var(--primary);

            font-size: 24px;
            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;

            font-weight: 600;
            font-size: 14px;

            margin-bottom: 8px;

            color: var(--primary);
        }

        input[type="text"] {
            width: 100%;

            padding: 12px 16px;

            border: 2px solid #e0e0e0;
            border-radius: 8px;

            font-size: 16px;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(0, 47, 108, 0.1);
        }

        .btn-search {
            width: 100%;

            background-color: var(--primary);
            color: white;

            border: none;

            padding: 14px;

            font-size: 16px;
            font-weight: 600;

            border-radius: 8px;

            cursor: pointer;

            transition:
                background-color 0.3s ease,
                transform 0.15s ease;
        }

        .btn-search:hover {
            background-color: #001f4d;
        }

        .btn-search:active {
            transform: scale(0.99);
        }

        .btn-search:focus-visible {
            outline: 3px solid rgba(0, 47, 108, 0.25);
            outline-offset: 3px;
        }

        .status {
            display: none;

            margin-top: 16px;
            padding: 12px;

            background: #f4f7fb;

            border-radius: 8px;

            color: var(--primary);

            font-size: 13px;
            line-height: 1.5;

            text-align: left;
        }

        .note {
            margin-top: 15px;

            font-size: 11px;
            color: #777;

            line-height: 1.5;
        }

        @media (max-width: 480px) {

            body {
                padding: 14px;
            }

            .tracker-card {
                padding: 24px 20px;
            }

            .logo-placeholder {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="tracker-card">

    <div class="logo-placeholder">
        KLIA TERMINAL 1
    </div>

    <div class="subtitle">
        Live Departure Flight Status
    </div>

    <form id="flightForm">

        <div class="form-group">

            <label for="flightInput">
                Flight Number or Destination
            </label>

            <input
                type="text"
                id="flightInput"
                name="flight"
                placeholder="e.g. MH123 or London"
                autocomplete="off"
                maxlength="50"
                required
            >

        </div>

        <button
            type="submit"
            class="btn-search"
        >
            Search Live Status
        </button>

    </form>

    <div
        id="statusMessage"
        class="status"
        aria-live="polite"
    ></div>

    <div class="note">
        Opens the Trip.com KLIA live flight status service.
    </div>

</div>

<script>
    const form =
        document.getElementById("flightForm");

    const input =
        document.getElementById("flightInput");

    const statusMessage =
        document.getElementById("statusMessage");


    form.addEventListener("submit", function (event) {

        event.preventDefault();


        const query =
            input.value.trim();


        if (!query) {
            return;
        }


        const targetUrl =
            "https://www.trip.com/flights/status/kul/?&allianceid=14900&sid=4141571&ppcid=ckid-56229731667_adid-515041284145_akid-kwd-342372378891_adgid-119626675423&utm_source=google&utm_medium=cpc&utm_campaign=12766215807&gad_source=1&gad_campaignid=12766215807&gbraid=0AAAAABn2eFI48elC_6GPsErhTTF2zxoe4&gclid=Cj0KCQjw--7UBhCpARIsAGJBpth3wiRfvcug135vSGpTdTpcWbKH95ZgkO1JBsyw5HnHWtEZsNdWOcUaAqbJEALw_wcB";


        statusMessage.style.display = "block";

        statusMessage.textContent =
            `Opening Trip.com KLIA flight status for "${query}".`;


        const newWindow =
            window.open(
                targetUrl,
                "_blank",
                "noopener,noreferrer"
            );


        if (!newWindow) {

            window.location.href =
                targetUrl;

        }

    });
</script>

</body>
</html>
