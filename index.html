<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLIA Terminal 1 Flight Tracker</title>
    <style>
        :root {
            --primary: #002f6c;
            --accent: #d4af37;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .tracker-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo-placeholder {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-search {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-search:hover {
            background-color: #001f4d;
        }

        .note {
            margin-top: 15px;
            font-size: 11px;
            color: #999;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="tracker-card">
    <div class="logo-placeholder">KLIA TERMINAL 1</div>
    <div class="subtitle">Live Departure Flight Status</div>
    
    <form id="flightForm" onsubmit="searchFlight(event)">
        <div class="form-group">
            <label for="flightInput">Flight Number or Destination</label>
            <input 
                type="text" 
                id="flightInput" 
                placeholder="e.g., MH123 or London" 
                required
            >
        </div>
        <button type="submit" class="btn-search">Search Live Status</button>
    </form>

    <div class="note">
        This tool securely redirects your query to the live database at malaysiaairports.com.my for verified gate, counter, and delay metrics.
    </div>
</div>

<script>
    function searchFlight(event) {
        event.preventDefault();
        
        // Get user input and clean it up
        const query = document.getElementById('flightInput').value.trim();
        
        if (query) {
            // Encode the parameters to safely pass through the URL string
            const targetUrl = `https://malaysiaairports.com.my{encodeURIComponent(query)}`;
            
            // Open the specific filtered flight status list in a new tab
            window.open(targetUrl, '_blank');
        }
    }
</script>

</body>
</html>
